<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mir Omar Ali | Digital Marketing Specialist</title>

    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* --- Core System Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        :root {
            --primary: #8a2be2;      /* Vivid Deep Purple */
            --primary-glow: #b066ff; /* Accent Glow Purple */
            --bg-dark: #09070f;      /* Clean Dark Background */
            --bg-card: #13101c;      /* Elevated Premium Surface Card */
            --text-main: #f1edf7;    /* Primary Readable Text */
            --text-muted: #a39cb5;   /* Secondary Subtext Accent */
            --border-line: rgba(138, 43, 226, 0.15);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; }
        li { list-style: none; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        section { padding: 100px 0; }

        /* --- Section Header UI --- */
        .section-title {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 60px;
            letter-spacing: -0.5px;
        }

        .section-title span {
            color: var(--primary-glow);
            background: linear-gradient(45deg, var(--primary), var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Global Interactive Button --- */
        .btn {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, var(--primary), #6200ea);
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.5);
            background: linear-gradient(135deg, var(--primary-glow), var(--primary));
        }

        /* --- Header / Navigation UI --- */
        header {
            background-color: rgba(9, 7, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-line);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            gap: 6px;
        }

        .logo .highlight {
            color: var(--primary-glow);
        }

        .nav-links { display: flex; gap: 32px; }
        .nav-links a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #ffffff; }

        .hero {

            padding-top: 160px;

            min-height: 85vh;
            display: flex;
            align-items: center;
        }

            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 24px;
            letter-spacing: -1.5px;
        }

        .hero-content h1 span {
            background: linear-gradient(45deg, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 600px;
        }

        .hero-visual {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* --- Stats Layout System --- */

            border-top: 1px solid var(--border-line);
            border-bottom: 1px solid var(--border-line);
            padding: 60px 0;

        .stats-grid {

            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }

        .stat-item {
            padding: 20px;
            border-left: 3px solid var(--primary);
            background: rgba(255,255,255,0.01);
        }

            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .stat-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Services Card Grid --- */
        .services-grid {
            display: grid;

            border-radius: 16px;
            border: 1px solid var(--border-line);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-glow);
            box-shadow: 0 12px 30px rgba(138, 43, 226, 0.15);
        }

        .service-card i {

            color: var(--primary-glow);

        .service-card h3 {

            margin-bottom: 16px;
            font-weight: 700;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        }

            gap: 60px;
            align-items: center;
        }

        .re-info h3 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .re-info p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .re-feature-list li {
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .re-feature-list i {

            font-size: 1.2rem;
            margin-top: 4px;
        }

        .re-feature-list h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .re-feature-list p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin: 0;
        }

        .re-matrix-panel {

            grid-template-columns: 1fr 1fr;
            gap: 20px;

        .matrix-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }

        .matrix-card h4 {
            font-size: 2.2rem;
            color: var(--primary-glow);
            font-weight: 800;
            margin-bottom: 4px;
        }

        .matrix-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contact-layout {
            max-width: 650px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid var(--border-line);
        }

        .contact-channels {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .channel-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 1rem;
            transition: color 0.3s;
        }

        .channel-link:hover { color: var(--primary-glow); }
        .channel-link i { color: var(--primary); }
